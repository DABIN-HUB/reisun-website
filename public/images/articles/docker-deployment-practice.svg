<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">一次发布，不只是启动容器</title><desc id="desc">REISUN 原创工程实践 / Docker技术示意封面，不代表真实项目。</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#DFE8F5" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#245EEA" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="750" fill="#F4F7FB"/><rect x="35" y="240" width="1130" height="440" fill="url(#grid)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="73" fill="#245EEA" font-size="19" font-weight="600" text-anchor="start">工程实践 / Docker</text><text x="64" y="143" fill="#102B50" font-size="44" font-weight="600" text-anchor="start">一次发布，不只是启动容器</text><text x="64" y="194" fill="#5B6B80" font-size="21" font-weight="400" text-anchor="start">从可追溯的产物，到可恢复的运行状态</text><rect x="64" y="332" width="285" height="148" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="88" y="375" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">构建产物</text><text x="88" y="409" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">应用包 / 依赖 / 清单</text><path d="M349 406H430V406" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><rect x="442" y="282" width="310" height="340" rx="10" fill="#102B50" stroke="#102B50" stroke-width="2"/><text x="475" y="331" fill="white" font-size="28" font-weight="600" text-anchor="start">发布单元</text><rect x="475" y="355" width="243" height="52" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="596" y="390" fill="white" font-size="20" font-weight="500" text-anchor="middle">镜像版本可追溯</text><rect x="475" y="427" width="243" height="52" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="596" y="462" fill="white" font-size="20" font-weight="500" text-anchor="middle">环境配置分离</text><rect x="475" y="499" width="243" height="52" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="596" y="534" fill="white" font-size="20" font-weight="500" text-anchor="middle">运行身份受限</text><path d="M752 406H831V406" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><rect x="844" y="332" width="292" height="148" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="868" y="375" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">运行环境</text><text x="868" y="409" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">日志 / 存储 / 访问边界</text><path d="M990 508V657H210V508" fill="none" stroke="#245EEA" stroke-width="3" stroke-dasharray="8 7"/><text x="600" y="647" fill="#245EEA" font-size="19" font-weight="500" text-anchor="middle">保留回退路径，不把启动等同于业务可用</text>
