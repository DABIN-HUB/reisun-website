<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">接入协议，也接入语义</title><desc id="desc">REISUN 原创协议接入 / 工业数据技术示意封面，不代表真实项目。</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#DFE8F5" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#245EEA" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="750" fill="#F4F7FB"/><rect x="35" y="240" width="1130" height="440" fill="url(#grid)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="73" fill="#245EEA" font-size="19" font-weight="600" text-anchor="start">协议接入 / 工业数据</text><text x="64" y="143" fill="#102B50" font-size="44" font-weight="600" text-anchor="start">接入协议，也接入语义</text><text x="64" y="194" fill="#5B6B80" font-size="21" font-weight="400" text-anchor="start">两类接口，一套可解释的数据边界</text><rect x="64" y="286" width="290" height="120" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="88" y="329" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">Modbus TCP</text><text x="88" y="363" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">点表与寄存器映射</text><rect x="64" y="490" width="290" height="120" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="88" y="533" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">OPC UA</text><text x="88" y="567" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">节点语义与安全配置</text><path d="M354 346H460V346" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><path d="M354 550H460V550" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><rect x="472" y="270" width="304" height="370" rx="10" fill="#102B50" stroke="#102B50" stroke-width="2"/><text x="505" y="320" fill="white" font-size="28" font-weight="600" text-anchor="start">统一采集模型</text><rect x="505" y="364" width="237" height="48" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="623" y="396" fill="white" font-size="21" font-weight="500" text-anchor="middle">值与单位</text><rect x="505" y="432" width="237" height="48" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="623" y="464" fill="white" font-size="21" font-weight="500" text-anchor="middle">质量与时间</text><rect x="505" y="500" width="237" height="48" rx="5" fill="#193F70" stroke="#42608A" stroke-width="2"/><text x="623" y="532" fill="white" font-size="21" font-weight="500" text-anchor="middle">来源与映射</text><path d="M776 452H858V452" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><rect x="875" y="387" width="261" height="125" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="899" y="430" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">业务系统</text><text x="899" y="464" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">同一语义 / 保留差异</text>
<path d="M64 698H1136" stroke="#D6E1EF"/><text x="64" y="730" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">REISUN / 技术演示</text><text x="1136" y="730" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="end">原创概念图 · 非交付记录</text></g></svg>