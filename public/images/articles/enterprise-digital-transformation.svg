<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
<title id="title">从一条业务闭环开始</title><desc id="desc">小斌opc 原创数字化 / 业务方法技术示意封面，不代表真实项目。</desc>
<defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#DFE8F5" stroke-width="1"/></pattern><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8" fill="none" stroke="#245EEA" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="750" fill="#F4F7FB"/><rect x="35" y="240" width="1130" height="440" fill="url(#grid)"/>
<g font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif"><text x="64" y="73" fill="#245EEA" font-size="19" font-weight="600" text-anchor="start">数字化 / 业务方法</text><text x="64" y="143" fill="#102B50" font-size="44" font-weight="600" text-anchor="start">从一条业务闭环开始</text><text x="64" y="194" fill="#5B6B80" font-size="21" font-weight="400" text-anchor="start">先解决可定义的问题，再扩大系统的边界</text><rect x="64" y="292" width="274" height="128" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="88" y="335" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">现场问题</text><text x="88" y="369" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">重复录入 / 信息滞后</text><rect x="463" y="292" width="274" height="128" rx="10" fill="#102B50" stroke="#CEDCEE" stroke-width="2"/><text x="487" y="335" fill="white" font-size="24" font-weight="600" text-anchor="start">流程试点</text><text x="487" y="369" fill="#BBCDE4" font-size="16" font-weight="400" text-anchor="start">责任 / 状态 / 异常出口</text><rect x="862" y="292" width="274" height="128" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="886" y="335" fill="#172B46" font-size="24" font-weight="600" text-anchor="start">可验证结果</text><text x="886" y="369" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">完成条件 / 数据来源</text><path d="M338 356H450V356" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><path d="M737 356H850V356" fill="none" stroke="#245EEA" stroke-width="3" marker-end="url(#arrow)"/><rect x="160" y="498" width="880" height="127" rx="10" fill="white" stroke="#CEDCEE" stroke-width="2"/><text x="194" y="543" fill="#172B46" font-size="25" font-weight="600" text-anchor="start">系统建设的共同底座</text><text x="194" y="587" fill="#5B6B80" font-size="21" font-weight="400" text-anchor="start">流程定义    主数据    角色权限    审计留痕    退出机制</text><path d="M998 432V467H201V432" fill="none" stroke="#245EEA" stroke-width="3" stroke-dasharray="8 7"/><text x="600" y="461" fill="#245EEA" font-size="18" font-weight="500" text-anchor="middle">带着现场反馈迭代</text>
<path d="M64 698H1136" stroke="#D6E1EF"/><text x="64" y="730" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="start">小斌opc / 技术演示</text><text x="1136" y="730" fill="#5B6B80" font-size="16" font-weight="400" text-anchor="end">原创概念图 · 非交付记录</text></g></svg>