site:
  name: REISUN
  site: 'https://reisun.cn'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: null

metadata:
  title:
    default: REISUN｜软件定制开发与企业数字化解决方案
    template: '%s｜REISUN'
  description: 'REISUN 独立软件开发品牌，专注 Java 企业应用、工业物联网、ERP/OA、微信小程序与系统集成。用清晰的工程方法，让技术真正服务业务。'
  # 第一阶段仅本地 UI 演示，正式上线前再确认索引策略。
  robots:
    index: false
    follow: true
  openGraph:
    site_name: REISUN
    images:
      - url: '/images/reisun-og.png'
        width: 1200
        height: 630
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: zh-CN
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 6
    post:
      isEnabled: true
      permalink: '/blog/%slug%'
      robots:
        index: false
    list:
      isEnabled: true
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: true
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: true
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: true
    relatedPostsCount: 3

analytics:
  vendors:
    googleAnalytics:
      id: null

ui:
  theme: 'light:only'
