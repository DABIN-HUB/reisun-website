worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 8080;
        server_name _;

        # Resolve the relative current symlink for new requests after publication.
        root /srv/site/current;
        index index.html index.htm;
        open_file_cache off;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/xml text/xml application/rss+xml image/svg+xml;

        # Old HTML may still reference old content-hashed assets. Never remove
        # those assets merely because current points to a newer release.
        location ^~ /_astro/ {
            alias /srv/site/assets/_astro/;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
            add_header Cache-Control "no-cache" always;
        }

        location / {
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri/index.html =404;
        }
    }
}
